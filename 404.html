<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Bitzy</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .notfound-wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: 48px 20px;
            text-align: center;
        }

        .notfound-wrap img {
            width: 128px;
            margin-bottom: 16px;
        }

        .notfound-wrap h2 {
            justify-content: center;
            margin-bottom: 6px;
        }

        .notfound-wrap p {
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .notfound-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .notfound-links a {
            text-decoration: none;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: 999px;
            border: 1.5px solid var(--input-border);
            background: var(--white);
            color: var(--primary);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .notfound-links a:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="notfound-wrap">
            <img src="assets/binary-conversion-exchange.png" alt="Binary Conversion Exchange icon">
            <h2>404 &mdash; Those bits don't exist</h2>
            <p>The page you were looking for was not found. Pick a tool and keep converting.</p>
            <div class="notfound-links">
                <a href="index.html">Live Base Converter</a>
                <a href="register.html">8-Bit Register</a>
                <a href="cheatsheet.html">Cheat Sheet</a>
                <a href="ascii.html">ASCII Lab</a>
            </div>
        </div>
    </div>
</body>

</html>
